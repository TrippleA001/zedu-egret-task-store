name: build-contributors

on:
  repository_dispatch:
    types: [contributor-update]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      repo:
        description: "Target repo (owner/repo)"
        required: false
        default: "HNG-ZEDU-EGRET/zedu-fe"
      branch:
        description: "Target branch"
        required: false
        default: "staging"
      dir:
        description: "Target directory inside the repo"
        required: false
        default: "src/app/(homepage)/contributors/egrets"

permissions:
  contents: read

concurrency:
  group: publish-contributors
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 20 has no global WebSocket. createClient() eagerly builds a
          # RealtimeClient, which throws "Node.js detected but native WebSocket
          # not found" (websocket-factory.js:49-53). Node 22+ exposes the
          # global; 24 matches the local dev machine so CI == dev.
          node-version: 24
      - run: npm ci
      - name: Publish contributors page to staging repo
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CONTRIBUTORS_REPO_TOKEN: ${{ secrets.CONTRIBUTORS_REPO_TOKEN }}
          CONTRIBUTORS_REPO: ${{ inputs.repo || vars.CONTRIBUTORS_REPO || 'HNG-ZEDU-EGRET/zedu-fe' }}
          CONTRIBUTORS_REPO_BRANCH: ${{ inputs.branch || vars.CONTRIBUTORS_REPO_BRANCH || 'staging' }}
          CONTRIBUTORS_REPO_DIR: ${{ inputs.dir || vars.CONTRIBUTORS_REPO_DIR || 'src/app/(homepage)/contributors/egrets' }}
        run: npx tsx scripts/publish-contributors.ts
